<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Nihad KP</title>
  <style>
    body { background: #0d1512; color: #e6f0ea; font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    div { text-align: center; padding: 2rem; }
    h1 { font-size: 1.5rem; }
    p { opacity: 0.7; font-size: 0.9rem; line-height: 1.6; }
    a { color: #34d399; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:999px; background:#f59e0b; margin-right:8px; }
  </style>
</head>
<body>
  <div>
    <p><span class="dot"></span>No connection</p>
    <h1>You are offline</h1>
    <p>The site needs a connection to load this page.<br>Reconnect and try again.</p>
    <a href="/">Retry</a>
  </div>
</body>
</html>
